<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bryan Samuel James | Software + ML</title>
    <meta name="description" content="Bryan Samuel James — software engineer building reliable systems and ML-powered products." />
    <meta name="theme-color" content="#0b0f19" />
    <meta property="og:title" content="Bryan Samuel James | Portfolio" />
    <meta property="og:description" content="Software Engineering + ML projects, experience, and contact." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <link rel="icon" href="/favicon.svg" />
    <script>
      // Prevent theme flash: read preference ASAP
      (function () {
        try {
          const key = "bryan_theme";
          const stored = localStorage.getItem(key);
          const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = stored ? stored : prefersDark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Bryan Samuel James",
        "jobTitle": "Software Engineering / ML",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Boston",
          "addressRegion": "MA",
          "addressCountry": "US"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
